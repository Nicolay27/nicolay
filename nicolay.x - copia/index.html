<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width: 300px;">
  <h4 class="text-center mb-3">Iniciar Sesión</h4>

  <input type="text" id="usuario" class="form-control mb-2" placeholder="Usuario">
  <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">

  <button class="btn btn-primary w-100" onclick="login()">
    Entrar
  </button>

  <p id="mensaje" class="mt-3 text-center"></p>
</div>

<script src="app.js"></script>

</body>
</html>
